name: vendor bundle

# Builds the vendor bundle (tools/mahina-bundle.sh: stripped, PIC libmahina
# archives for every supported Rust target, plus mahina.h and the Rust
# binding crates) once, on Linux — zig cross-compiles every target, so CI and
# a local `just bundle` produce the same bytes — and proves it twice over:
#   - reproducible: a second build from another path, with a cold cache, must
#     give byte-identical archives;
#   - consumable: on a native runner per target, a minimal Rust crate built
#     against the bundle with NO zig installed links and runs one VM lifecycle
#     (tools/bundle-smoke.sh --strict: nothing may be skipped).
# The bundle is uploaded as the `mahina-bundle` artifact.
#
# Releases: pushing a tag `vX.Y.Z` runs the same build + proofs and then
# publishes the bundle as a GitHub Release (`release` job below). The tag must
# equal the version of both Rust crates (embed/rust/*/Cargo.toml), so a
# release, the crates inside it and a downstream lock file all name one
# version. Downstream projects pin a release's tarball by URL + sha256.

on:
  push:
    branches: [master]
    # Tag pushes ignore the paths filter: every version tag builds.
    tags: ['v*']
    paths:
      - src/**
      - include/**
      - embed/**
      - build.zig
      - build.zig.zon
      - .zig-version
      - tools/mahina-bundle.sh
      - tools/bundle-smoke.sh
      - tests/bundle_smoke/**
      - .github/workflows/bundle.yml
  pull_request:
    paths:
      - src/**
      - include/**
      - embed/**
      - build.zig
      - build.zig.zon
      - .zig-version
      - tools/mahina-bundle.sh
      - tools/bundle-smoke.sh
      - tests/bundle_smoke/**
      - .github/workflows/bundle.yml
  workflow_dispatch:

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by .zig-version. ziglang.org garbage-collects old -dev builds, so we
  # fetch from the community mirror list at a pinned digest rather than trusting
  # whichever mirror answers first (the same pin as the profile workflow).
  ZIG_VERSION: 0.17.0-dev.813+2153f8143
  ZIG_SHA256: b0d46ffc4587b9e8dd0b524ee5bc4da1e67f28bba55e7c534cec64af2f2d7a74

jobs:
  bundle:
    name: build the bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Verify the toolchain pin matches .zig-version
        run: |
          set -eu
          pinned=$(tr -d '[:space:]' < .zig-version)
          if [ "$pinned" != "$ZIG_VERSION" ]; then
            echo "::error::.zig-version says '$pinned' but this workflow pins '$ZIG_VERSION'"
            echo "Update ZIG_VERSION *and* ZIG_SHA256 together."
            exit 1
          fi

      - name: Install Zig
        run: |
          set -eu
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o /tmp/mirrors.txt https://ziglang.org/download/community-mirrors.txt
          ok=
          while read -r mirror; do
            [ -n "$mirror" ] || continue
            echo "trying $mirror"
            if curl -fsSL --max-time 180 -o /tmp/zig.tar.xz "$mirror/$tarball"; then
              if echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -; then
                ok=1
                break
              fi
              echo "digest mismatch from $mirror - discarding"
              rm -f /tmp/zig.tar.xz
            fi
          done < /tmp/mirrors.txt
          if [ -z "$ok" ]; then
            echo "::error::no mirror served $tarball at the pinned digest"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          test "$("$RUNNER_TEMP/zig/zig" version)" = "$ZIG_VERSION"
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build the bundle
        run: bash tools/mahina-bundle.sh "$RUNNER_TEMP/mahina-bundle"

      - name: Rebuild from another path with a cold cache, and compare
        run: |
          set -eu
          rsync -a --exclude /.zig-cache --exclude /zig-out ./ "$RUNNER_TEMP/repro/"
          (cd "$RUNNER_TEMP/repro" && bash tools/mahina-bundle.sh "$RUNNER_TEMP/mahina-bundle-repro")
          diff "$RUNNER_TEMP/mahina-bundle/SHA256SUMS" "$RUNNER_TEMP/mahina-bundle-repro/SHA256SUMS"
          cat "$RUNNER_TEMP/mahina-bundle/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: mahina-bundle
          path: ${{ runner.temp }}/mahina-bundle
          if-no-files-found: error

  smoke:
    name: smoke ${{ matrix.runner }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
          - runner: macos-15-intel
            targets: x86_64-apple-darwin
          - runner: macos-15
            targets: aarch64-apple-darwin
          - runner: windows-latest
            targets: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: mahina-bundle
          path: mahina-bundle

      - name: Install Rust
        run: |
          set -eu
          if ! command -v rustup >/dev/null; then
            case "$RUNNER_OS" in
              Windows)
                case "$RUNNER_ARCH" in
                  ARM64) arch=aarch64 ;;
                  *) arch=x86_64 ;;
                esac
                curl -fsSL -o "$RUNNER_TEMP/rustup-init.exe" "https://win.rustup.rs/$arch"
                "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal
                cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                ;;
              *)
                curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
                echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                ;;
            esac
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.targets }}
          rustc -vV

      - name: Smoke-test the bundle (no zig installed)
        run: |
          set -eu
          if command -v zig >/dev/null; then
            echo "::warning::this runner has a zig on PATH; the smoke script hides it"
          fi
          bash tools/bundle-smoke.sh --strict mahina-bundle ${{ matrix.targets }}

  release:
    name: publish the release
    # Only for version tags, and only once every target's smoke passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: mahina-bundle
          path: mahina-bundle

      - name: Check the tag, the crates and the bundle agree
        run: |
          set -eu
          tag=${GITHUB_REF_NAME}
          for crate in mahina mahina-sys; do
            v=$(sed -n 's/^version = "\(.*\)"$/\1/p' "embed/rust/$crate/Cargo.toml" | head -1)
            if [ "v$v" != "$tag" ]; then
              echo "::error::tag $tag but embed/rust/$crate is version $v; bump the crates first"
              exit 1
            fi
          done
          commit=$(cat mahina-bundle/LUNE_COMMIT)
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::bundle LUNE_COMMIT is '$commit', want the tagged commit $GITHUB_SHA"
            exit 1
          fi
          (cd mahina-bundle && sha256sum -c SHA256SUMS)

      - name: Pack the release tarball
        # Reproducible: sorted names, zeroed mtimes/owners, normalised modes,
        # and gzip without a timestamp, so the same bundle gives the same
        # tarball (and sha256) every time.
        run: |
          set -eu
          name=mahina-bundle-${GITHUB_REF_NAME}
          mv mahina-bundle "$name"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' --format=gnu -cf - "$name" | gzip -9 -n > "$name.tar.gz"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          {
            echo "mahina ${GITHUB_REF_NAME}: the vendor bundle, prebuilt libmahina for every supported Rust target."
            echo
            echo "- lune commit: \`$(cat "$name/LUNE_COMMIT")\`"
            echo "- zig: \`$(cat "$name/ZIG_VERSION")\`"
            echo "- tarball sha256: \`$(cut -d' ' -f1 "$name.tar.gz.sha256")\`"
            echo
            echo "Unpack, then build with \`MAHINA_PREBUILT_ROOT=<dir>/lib\` against \`<dir>/rust/mahina\`; no zig needed."
            echo
            echo "Archives:"
            echo '```'
            cat "$name/SHA256SUMS"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          name=mahina-bundle-${GITHUB_REF_NAME}
          gh release create "$GITHUB_REF_NAME" "$name.tar.gz" "$name.tar.gz.sha256" \
            --verify-tag --title "mahina ${GITHUB_REF_NAME}" --notes-file notes.md
