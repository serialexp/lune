name: vendor bundle and CLI

# Builds the two release artifacts once each, on Linux — zig cross-compiles
# every target, so CI and a local `just bundle` / `just cli` produce the same
# bytes:
#   - the vendor bundle (tools/mahina-bundle.sh: stripped, PIC libmahina
#     archives for every supported Rust target, plus mahina.h and the Rust
#     binding crates), uploaded as the `mahina-bundle` artifact;
#   - the CLI (tools/mahina-cli.sh: a stripped `mahina` per platform with the
#     trace visualiser embedded for `mahina viz`), uploaded as `mahina-cli`.
# Each is proved twice over:
#   - reproducible: a second build from another path, with a cold cache, must
#     give byte-identical archives;
#   - usable on a native runner per target, nothing skipped (--strict): a
#     minimal Rust crate built against the bundle with NO zig installed links
#     and runs one VM lifecycle (tools/bundle-smoke.sh); the CLI runs scripts
#     and serves its UI and POST /run (tools/cli-smoke.sh), and that UI works
#     when driven in headless Chrome (viz/e2e/browser-smoke.ts).
#
# Releases: pushing a tag `vX.Y.Z` runs the same builds + proofs and then
# publishes both as one GitHub Release (`release` job below). The tag must
# equal the version of both Rust crates (embed/rust/*/Cargo.toml), so a
# release, the crates inside it and a downstream lock file all name one
# version. Downstream projects pin a release's tarball by URL + sha256.

on:
  push:
    branches: [master]
    # Tag pushes ignore the paths filter: every version tag builds.
    tags: ['v*']
    paths:
      - src/**
      - include/**
      - embed/**
      - viz/**
      - build.zig
      - build.zig.zon
      - .zig-version
      - tools/mahina-bundle.sh
      - tools/bundle-smoke.sh
      - tools/mahina-cli.sh
      - tools/cli-smoke.sh
      - tools/embed_assets.zig
      - tools/install-smoke.sh
      - install.sh
      - tests/bundle_smoke/**
      - .github/workflows/bundle.yml
      - .github/actions/install-zig/**
  pull_request:
    paths:
      - src/**
      - include/**
      - embed/**
      - viz/**
      - build.zig
      - build.zig.zon
      - .zig-version
      - tools/mahina-bundle.sh
      - tools/bundle-smoke.sh
      - tools/mahina-cli.sh
      - tools/cli-smoke.sh
      - tools/embed_assets.zig
      - tools/install-smoke.sh
      - install.sh
      - tests/bundle_smoke/**
      - .github/workflows/bundle.yml
      - .github/actions/install-zig/**
  workflow_dispatch:

concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by .zig-version (the same pin as the profile workflow); the digest
  # is ziglang.org/download/index.json's shasum for the x86_64-linux tarball.
  # .github/actions/install-zig fetches it from the community mirrors.
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026

jobs:
  bundle:
    name: build the bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/install-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}

      - name: Build the bundle
        run: bash tools/mahina-bundle.sh "$RUNNER_TEMP/mahina-bundle"

      - name: Rebuild from another path with a cold cache, and compare
        run: |
          set -eu
          rsync -a --exclude /.zig-cache --exclude /zig-out ./ "$RUNNER_TEMP/repro/"
          (cd "$RUNNER_TEMP/repro" && bash tools/mahina-bundle.sh "$RUNNER_TEMP/mahina-bundle-repro")
          diff "$RUNNER_TEMP/mahina-bundle/SHA256SUMS" "$RUNNER_TEMP/mahina-bundle-repro/SHA256SUMS"
          cat "$RUNNER_TEMP/mahina-bundle/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: mahina-bundle
          path: ${{ runner.temp }}/mahina-bundle
          if-no-files-found: error

  smoke:
    name: smoke ${{ matrix.runner }}
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
          - runner: macos-15-intel
            targets: x86_64-apple-darwin
          - runner: macos-15
            targets: aarch64-apple-darwin
          - runner: windows-latest
            targets: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: mahina-bundle
          path: mahina-bundle

      - name: Install Rust
        run: |
          set -eu
          if ! command -v rustup >/dev/null; then
            case "$RUNNER_OS" in
              Windows)
                case "$RUNNER_ARCH" in
                  ARM64) arch=aarch64 ;;
                  *) arch=x86_64 ;;
                esac
                curl -fsSL -o "$RUNNER_TEMP/rustup-init.exe" "https://win.rustup.rs/$arch"
                "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal
                cygpath -w "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                ;;
              *)
                curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
                echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                ;;
            esac
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.targets }}
          rustc -vV

      - name: Smoke-test the bundle (no zig installed)
        run: |
          set -eu
          if command -v zig >/dev/null; then
            echo "::warning::this runner has a zig on PATH; the smoke script hides it"
          fi
          bash tools/bundle-smoke.sh --strict mahina-bundle ${{ matrix.targets }}

  cli:
    name: build the CLI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/install-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}

      # The web UI's toolchain: the pnpm viz/package.json pins
      # (`packageManager`), on the Node it needs (>= 22.13).
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: viz/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the CLI
        run: bash tools/mahina-cli.sh "$RUNNER_TEMP/mahina-cli"

      - name: Rebuild from another path with cold caches, and compare
        run: |
          set -eu
          rsync -a --exclude /.zig-cache --exclude /zig-out --exclude /viz/node_modules ./ "$RUNNER_TEMP/repro/"
          (cd "$RUNNER_TEMP/repro" && bash tools/mahina-cli.sh "$RUNNER_TEMP/mahina-cli-repro")
          diff "$RUNNER_TEMP/mahina-cli/SHA256SUMS" "$RUNNER_TEMP/mahina-cli-repro/SHA256SUMS"
          cat "$RUNNER_TEMP/mahina-cli/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: mahina-cli
          path: ${{ runner.temp }}/mahina-cli
          if-no-files-found: error

  cli-smoke:
    name: CLI smoke ${{ matrix.platform }}
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x86_64-linux
          - runner: ubuntu-24.04-arm
            platform: aarch64-linux
          - runner: macos-15-intel
            platform: x86_64-macos
          - runner: macos-15
            platform: aarch64-macos
          - runner: windows-latest
            platform: x86_64-windows
          - runner: windows-11-arm
            platform: aarch64-windows
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: mahina-cli
          path: mahina-cli

      - name: Smoke-test the CLI
        run: bash tools/cli-smoke.sh --strict mahina-cli ${{ matrix.platform }}

      # install.sh against these archives, served like a release (no
      # publishing needed). Linux and macOS only, as install.sh is.
      - name: Smoke-test install.sh
        if: runner.os != 'Windows'
        run: bash tools/install-smoke.sh mahina-cli

  # The visualiser driven in headless Chrome (viz/e2e/browser-smoke.ts):
  # load a trace, Run (wasm), Run both + diff, Replay. cli-smoke proves the
  # page's files are served; this proves the page works. Once, on x86-64
  # Linux: the page is the same bytes on every platform.
  viz-browser-smoke:
    name: visualiser in a browser
    needs: cli
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: mahina-cli
          path: mahina-cli

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: viz/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Drive mahina viz in Chrome
        run: |
          set -eu
          tar -xzf mahina-cli/mahina-x86_64-linux.tar.gz -C "$RUNNER_TEMP"
          cd viz
          pnpm install --frozen-lockfile
          pnpm run smoke:browser "$RUNNER_TEMP/mahina-x86_64-linux/mahina"

  release:
    name: publish the release
    # Only for version tags, and only once every target's smoke passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle, smoke, cli, cli-smoke, viz-browser-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: mahina-bundle
          path: mahina-bundle

      - uses: actions/download-artifact@v4
        with:
          name: mahina-cli
          path: mahina-cli

      - name: Check the tag, the crates, the bundle and the CLI agree
        run: |
          set -eu
          tag=${GITHUB_REF_NAME}
          v=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          if [ "v$v" != "$tag" ]; then
            echo "::error::tag $tag but build.zig.zon is version $v (what mahina --version says); bump it first"
            exit 1
          fi
          for crate in mahina mahina-sys; do
            v=$(sed -n 's/^version = "\(.*\)"$/\1/p' "embed/rust/$crate/Cargo.toml" | head -1)
            if [ "v$v" != "$tag" ]; then
              echo "::error::tag $tag but embed/rust/$crate is version $v; bump the crates first"
              exit 1
            fi
          done
          commit=$(cat mahina-bundle/LUNE_COMMIT)
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::bundle LUNE_COMMIT is '$commit', want the tagged commit $GITHUB_SHA"
            exit 1
          fi
          (cd mahina-bundle && sha256sum -c SHA256SUMS)
          commit=$(cat mahina-cli/LUNE_COMMIT)
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "::error::CLI LUNE_COMMIT is '$commit', want the tagged commit $GITHUB_SHA"
            exit 1
          fi
          (cd mahina-cli && sha256sum -c SHA256SUMS)

      - name: Pack the release tarball
        # Reproducible: sorted names, zeroed mtimes/owners, normalised modes,
        # and gzip without a timestamp, so the same bundle gives the same
        # tarball (and sha256) every time.
        run: |
          set -eu
          name=mahina-bundle-${GITHUB_REF_NAME}
          mv mahina-bundle "$name"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' --format=gnu -cf - "$name" | gzip -9 -n > "$name.tar.gz"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          # The CLI archives keep their bytes and gain the version in the name.
          mkdir cli-assets
          for f in mahina-cli/mahina-*; do
            base=${f#mahina-cli/mahina-}
            cp "$f" "cli-assets/mahina-${GITHUB_REF_NAME}-$base"
          done
          (cd cli-assets && sha256sum mahina-* > "mahina-${GITHUB_REF_NAME}-SHA256SUMS")
          {
            echo "mahina ${GITHUB_REF_NAME}"
            echo
            echo "- lune commit: \`$(cat "$name/LUNE_COMMIT")\`"
            echo "- zig: \`$(cat "$name/ZIG_VERSION")\`"
            echo
            echo "## CLI"
            echo
            echo "\`mahina-${GITHUB_REF_NAME}-<platform>\`: one \`mahina\` binary per platform with the trace visualiser built in."
            echo "Run scripts with \`mahina script.mahina\`; \`mahina viz [trace.mahinatrace]\` serves the visualiser on localhost."
            echo "The native JIT (\`--jit-native\`) is x86-64 Linux only; elsewhere it falls back to the interpreter tiers."
            echo
            echo "Linux/macOS: \`curl -fsSL https://raw.githubusercontent.com/serialexp/lune/master/install.sh | MAHINA_VERSION=${GITHUB_REF_NAME} sh\` (into \`~/.local/bin\`)."
            echo
            echo '```'
            cat "cli-assets/mahina-${GITHUB_REF_NAME}-SHA256SUMS"
            echo '```'
            echo
            echo "## Vendor bundle"
            echo
            echo "\`$name.tar.gz\`: prebuilt libmahina for every supported Rust target (sha256 \`$(cut -d' ' -f1 "$name.tar.gz.sha256")\`)."
            echo "Unpack, then build with \`MAHINA_PREBUILT_ROOT=<dir>/lib\` against \`<dir>/rust/mahina\`; no zig needed."
            echo
            echo "Archives:"
            echo '```'
            cat "$name/SHA256SUMS"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          name=mahina-bundle-${GITHUB_REF_NAME}
          gh release create "$GITHUB_REF_NAME" "$name.tar.gz" "$name.tar.gz.sha256" cli-assets/* \
            --verify-tag --title "mahina ${GITHUB_REF_NAME}" --notes-file notes.md

  install:
    name: install ${{ matrix.runner }} from the release
    # The published release, through the real GitHub URLs: pinned to this
    # tag, and as the latest release (which it just became).
    needs: release
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the tagged release and the latest one
        run: |
          set -eu
          for pin in "$GITHUB_REF_NAME" ""; do
            dir=$RUNNER_TEMP/install-${pin:-latest}
            MAHINA_VERSION=$pin MAHINA_INSTALL_DIR=$dir sh install.sh
            v=$("$dir/mahina" --version)
            echo "$v"
            case $v in
              "mahina ${GITHUB_REF_NAME#v}"*"commit: $GITHUB_SHA"*) ;;
              *) echo "::error::install ${pin:-latest} gave the wrong build"; exit 1 ;;
            esac
            test "$("$dir/mahina" -e 'print(6 * 7)')" = 42
          done
