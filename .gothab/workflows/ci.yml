name: CI

# The full gate, one leg per runner so the legs run in parallel (each leg is
# the CI twin of a local command; see the justfile and CLAUDE.md):
#   test        zig build test            (just test; the library tests run as
#                                          parallel shards, build.zig -Dtest-shards)
#   fmt         mahina fmt --check        (just fmt-check; doc 83 §9)
#   jit-debug   zig build test -Djit-debug=true
#   hashgate    just hashgate             (frozen output, ReleaseFast + Debug legs)
#   lib-wasm    zig build lib, zig build wasm
#   vitest      pnpm test in viz/, pnpm drift in editors/tree-sitter-mahina/
# Locally you run the fast subset; this is the whole gate. The benchmark board
# is not here: it needs the pinned pool and is dispatched with `gt profile`
# (profile-bench.yml).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by .zig-version, fetched from the community mirror list (as
  # ziglang.org asks CI to) at a pinned digest, exactly as profile-bench.yml.
  # The digest is ziglang.org/download/index.json's shasum for the x86_64-linux
  # tarball. Update ZIG_VERSION *and* ZIG_SHA256 together with .zig-version.
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
  TOOLS: /home/runner/mahina-ci-tools

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: 2xheavy
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit tests
            run: |
              python3 -m unittest discover -s tools -p test_jit_boundaries.py
              python3 tools/check-jit-boundaries.py
              time zig build test -Dtest-shards="$(nproc)" -Dtest-junit="$PWD/test-results" --summary all
          - name: formatted sources
            run: |
              time zig build
              time ./zig-out/bin/mahina fmt --check bench tests viz src
          - name: unit tests (jit-debug)
            run: time zig build test -Djit-debug=true -Dtest-shards="$(nproc)" --summary all
          - name: frozen-output gate
            run: |
              time zig build -Doptimize=ReleaseFast
              time zig build --prefix zig-out-debug
              time python3 tools/hashgate.py --also-mahina zig-out-debug/bin/mahina
          - name: embedding lib and wasm
            run: |
              time zig build lib
              time zig build wasm
          # The viz tests run the native CLI and the wasm VM; the drift test
          # runs the Tree-sitter grammar over every tracked mahina source.
          # Vitest's JUnit report carries the `[REQ-…]` tags of test names
          # (tools/vitest-requirements.ts, doc 79).
          - name: viz and grammar tests
            run: |
              time zig build
              time zig build wasm
              out="$PWD/test-results"
              mkdir -p "$out"
              cd viz
              pnpm install --frozen-lockfile
              time pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit="$out/viz.xml"
              cd ../editors/tree-sitter-mahina
              pnpm install --frozen-lockfile
              time pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit="$out/drift.xml"
    steps:
      - uses: actions/checkout@v5

      - name: Verify the toolchain pin matches .zig-version
        run: |
          set -eu
          pinned=$(tr -d '[:space:]' < .zig-version)
          if [ "$pinned" != "$ZIG_VERSION" ]; then
            echo "::error::.zig-version says '$pinned' but this workflow pins '$ZIG_VERSION'"
            echo "Update ZIG_VERSION *and* ZIG_SHA256 together."
            exit 1
          fi

      # The toolchain is the same bytes every run (pinned version + digest),
      # so it is restored instead of fetched from a mirror.
      - name: Restore the Zig toolchain
        id: zig-toolchain
        uses: actions/cache@v4
        with:
          path: /home/runner/mahina-ci-tools/zig
          key: zig-${{ env.ZIG_VERSION }}-${{ env.ZIG_SHA256 }}

      - name: Install Zig
        if: steps.zig-toolchain.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p "$TOOLS"
          tarball="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -fsSL -o /tmp/mirrors.txt https://ziglang.org/download/community-mirrors.txt
          ok=
          while read -r mirror; do
            [ -n "$mirror" ] || continue
            echo "trying $mirror"
            if curl -fsSL --max-time 180 -o /tmp/zig.tar.xz "$mirror/$tarball"; then
              if echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -; then
                ok=1
                break
              fi
              echo "digest mismatch from $mirror - discarding"
              rm -f /tmp/zig.tar.xz
            fi
          done < /tmp/mirrors.txt
          if [ -z "$ok" ]; then
            echo "::error::no mirror served $tarball at the pinned digest"
            exit 1
          fi
          mkdir -p "$TOOLS/zig"
          tar -xJf /tmp/zig.tar.xz -C "$TOOLS/zig" --strip-components=1

      - name: Put Zig on PATH
        run: |
          set -eu
          test "$("$TOOLS/zig/zig" version)" = "$ZIG_VERSION"
          echo "$TOOLS/zig" >> "$GITHUB_PATH"

      # Zig's global cache holds what does not depend on mahina's sources
      # (compiler_rt, libc for the C smoke test, the build runner). One per
      # leg, since each leg builds a different set; the run's sha keys a fresh
      # save and the prefix restores the newest earlier one. mahina's own
      # modules recompile whenever src/ changes, so .zig-cache is not kept.
      - name: Restore the Zig global cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-global-${{ env.ZIG_VERSION }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            zig-global-${{ env.ZIG_VERSION }}-${{ matrix.name }}-

      - name: Record the hardware class
        run: |
          grep -m1 'model name' /proc/cpuinfo
          echo "cores: $(nproc)"
          free -m | head -2

      - name: ${{ matrix.name }}
        # bash for the `time` keyword (sh has none).
        shell: bash
        run: |
          set -eu
          ${{ matrix.run }}

      # Doc 79: the unit-test leg's cases, with the requirement keys their
      # names cite, as one JUnit report.
      - name: Merge the unit-test report
        if: always() && matrix.name == 'unit tests'
        run: |
          mkdir -p test-results
          python3 tools/junit-merge.py test-results > test-results/junit.xml

      # The unit-test leg's merged report, or the Vitest leg's two reports.
      - name: Upload test results
        uses: actions/test-results@v1
        if: always() && (matrix.name == 'unit tests' || matrix.name == 'viz and grammar tests')
        with:
          files: test-results/*.xml
